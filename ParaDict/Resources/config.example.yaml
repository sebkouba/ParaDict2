# ParaDict Configuration
# Copy this file to ~/Library/Application Support/ParaDict/config.yaml

app:
  hide_dock_icon: true
  launch_at_login: false
  mute_during_recording: true

audio:
  device: "system_default"  # or specific device UID

llm:
  provider: groq
  model: kimi-k2
  api_key_env: GROQ_API_KEY  # Environment variable containing API key

hotkeys:
  # Local mode: Parakeet transcription only, no LLM enhancement
  - shortcut: right_option
    mode: local

  # Enhanced mode: Parakeet + LLM processing with custom prompt
  - shortcut: right_command
    mode: enhanced
    prompt: |
      Clean up this transcription. Fix grammar, punctuation,
      and formatting. Output only the cleaned text.

  # Example: Q&A mode
  # - shortcut: right_shift
  #   mode: enhanced
  #   prompt: |
  #     Answer this question concisely. The user asked via voice:

custom_vocabulary:
  - "Parakeet"
  - "Groq"
  - "ParaDict"

# Available shortcut options:
# - right_option, left_option
# - right_command, left_command
# - right_control, left_control
# - right_shift
# - fn
